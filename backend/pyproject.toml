[project]
name = "pokkhoai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=46,<47",
    "fastapi[standard]>=0.115,<1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "python-dotenv>=1,<2",
    "python-docx>=1.2.0",
    "sqlalchemy[asyncio]>=2,<3",
    "tabulate>=0.10.0",
    "pytesseract>=0.3.13",
    "uvicorn>=0.54.0",
    "google-genai>=3.5.0",
    "pyarrow>=18",
    "minio>=7.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.2.0,<10",
    "testcontainers[postgres]>=4.15.0",
]
# Local embedding/reranking models (torch). Only needed with EMBEDDING_PROVIDER=local,
# for the embed worker, and for ingestion (tokenizer). Not installed in Dockerfile.render.
ml = [
    "sentence-transformers>=6.3.0",
]

[tool.uv]
package = false
default-groups = ["dev", "ml"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
