[project]
name = "legal-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=46,<47",
    "fastapi[standard]>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
