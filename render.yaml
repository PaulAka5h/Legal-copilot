# Render Blueprint: PokkhoAI API on the FREE plan (512 MB RAM, Docker).
# Database: Neon. Documents: Backblaze B2. Search embeddings: multilingual-e5-small (ONNX int8)
# inside the image. LLM (analysis + search query rewriting): Gemini API (one key).
# Step-by-step guide: DOCS/deploy_render_free.md
#
# Values marked `sync: false` are secrets or per-account values: Render asks for
# them when you create the Blueprint and never reads them from this file.
# SYNTHETIC DEMO DATA ONLY (SAMPLE_DATA_NOT_REAL_LAW): see DOCS/providers.md.
services:
  - type: web
    name: pokkhoai-api
    runtime: docker
    plan: free
    region: singapore            # match your Neon region (AWS ap-southeast-1)
    branch: deploy/render
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- App ---
      - key: APP_ENV
        value: development        # demo: the Gemini LLM is refused in production by design
      - key: LOG_LEVEL
        value: INFO
      - key: APP_ORIGIN
        sync: false               # your Vercel URL, e.g. https://pokkhoai.vercel.app (no trailing slash)
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MFA_ENCRYPTION_KEY
        generateValue: true       # random 256-bit key (Fernet) for MFA secrets

      # --- Database (Neon, runtime role app_user, DIRECT host, not -pooler) ---
      - key: DATABASE_URL
        sync: false               # postgresql+asyncpg://app_user:<pw>@<ep-...>.neon.tech/neondb?sslmode=require

      # --- Object storage (Backblaze B2 through the minio client) ---
      - key: MINIO_ENDPOINT
        sync: false               # s3.<region>.backblazeb2.com  (host only, no https://, no path)
      - key: MINIO_REGION
        sync: false               # e.g. us-west-004 (the <region> part of the endpoint)
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false               # B2 keyID
      - key: MINIO_SECRET_KEY
        sync: false               # B2 applicationKey
      - key: MINIO_SECURE
        value: "true"

      # --- AI providers ---
      # Query embeddings must use the model the knowledge base was embedded with
      # (deploy/neon_cutover_e5small.sh: intfloat/multilingual-e5-small, 384 dims,
      # embedding_version 1); otherwise search answers 503 EMBEDDING_MODEL_MISMATCH.
      # The model is built into the image (Dockerfile.render) and runs on this CPU: query
      # text does not leave the server for embedding. The analysis threshold follows the
      # provider (app/config.py DEFAULT_MIN_SIMILARITY).
      - key: EMBEDDING_PROVIDER
        value: e5_small_onnx
      # One Gemini call per new search (cached) and per analysed fact rewrites the query
      # into Bangla + English + keywords; on any LLM error the plain query is searched.
      - key: SEARCH_QUERY_REWRITE
        value: "true"
      - key: RERANKER_PROVIDER
        value: mock
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_APPROVED_PROVIDERS
        value: gemini,groq,openrouter,mock
      # Analysis/strategy/hearing/fact chain: on 429/503/timeout/invalid output the next provider is
      # tried at once; providers without a key are skipped; the labelled mock comes last.
      - key: LLM_FALLBACK_CHAIN
        value: gemini,gemini_fallback,groq,openrouter,mock
      - key: GEMINI_API_KEY
        sync: false               # analysis and search query rewriting (search still works without it)
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # gemini-2.5-flash answers 404 for new keys (checked 2026-11-21).
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      # Free tiers, synthetic/public data only (DOCS/providers.md). Keys set in the Render dashboard.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free   # free, JSON mode + structured outputs (checked 2026-11-23)

      # --- Documents ---
      - key: MALWARE_SCANNER
        value: none
      - key: OCR_LANGUAGES
        value: ben+eng
      - key: OCR_DPI
        value: "250"              # measured peak 344 MiB with 3 concurrent OCR uploads
